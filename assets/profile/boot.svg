<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="CERRDA boot sequence">
  <title>boot - cerrda@kernel</title>
  <defs>
    <pattern id="scan2" width="1200" height="3" patternUnits="userSpaceOnUse">
      <rect width="1200" height="1" fill="#000" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="#0c0a10"/>
  <rect x="48" y="28" width="1104" height="364" fill="#100e16" stroke="#f0c4d4" stroke-opacity="0.28"/>
  <rect x="48" y="28" width="1104" height="32" fill="#16121c" stroke="#f0c4d4" stroke-opacity="0.28"/>

  <g transform="translate(64, 44)">
    <rect width="8" height="8" fill="#e07098"/>
    <rect x="14" width="8" height="8" fill="#c4a070"/>
    <rect x="28" width="8" height="8" fill="#7dcea0"/>
  </g>
  <text x="120" y="50" fill="#9a90a0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2.4">cerrda@kernel - zsh - 120x42</text>
  <text x="980" y="50" fill="#5a5460" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2.2">TTY.01</text>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="15" letter-spacing="0.4">
    <text x="72" y="104" fill="#5a5460">$ uname -a</text>
    <text x="72" y="132" fill="#d8d0d8">CERRDA/KERNEL 2026.9  vue/nuxt  vite  agent/dx  +type-surface</text>

    <text x="72" y="172" fill="#5a5460">$ whoami</text>
    <text x="72" y="200" fill="#f0c4d4">cerrda   frontend engineer / agent infrastructure</text>

    <text x="72" y="240" fill="#5a5460">$ cat ~/THESIS.md</text>
    <text x="72" y="268" fill="#c8c0c8">Compile one-off judgment into installable, versioned tools.</text>
    <text x="72" y="296" fill="#c8c0c8">Types land at build time. Agents execute the workflow.</text>

    <text x="72" y="336" fill="#5a5460">$ ls ~/signals --oneline</text>
    <text x="72" y="364" fill="#d8d0d8">fetch-dts   faker-mock   scrapling   dsh-theme   v-ellipsis   vCopy</text>

    <text x="72" y="392" fill="#7dcea0">$ status   runtime online / ready for handshake_</text>
  </g>

  <rect x="1046" y="380" width="9" height="16" fill="#f0c4d4">
    <animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite"/>
  </rect>

  <rect x="48" y="28" width="1104" height="364" fill="url(#scan2)" pointer-events="none"/>
</svg>
