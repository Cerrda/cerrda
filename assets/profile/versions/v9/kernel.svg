<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-label="CERRDA kernel map">
  <title>kernel - practice map</title>
  <defs>
    <pattern id="grid3" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#f0c4d4" stroke-width="0.35" opacity="0.07"/>
    </pattern>
    <pattern id="scan3" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect width="1200" height="1.1" fill="#000" opacity="0.3"/>
    </pattern>
    <marker id="tick" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#e07098" stroke-width="1"/>
    </marker>
    <filter id="grain3" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.06"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="480" fill="#0c0a10"/>
  <rect width="1200" height="480" fill="url(#grid3)"/>

  <g stroke="#f0c4d4" stroke-width="1" fill="none" opacity="0.5">
    <path d="M16 16 H40 M16 16 V40"/>
    <path d="M1184 16 H1160 M1184 16 V40"/>
    <path d="M16 464 H40 M16 464 V440"/>
    <path d="M1184 464 H1160 M1184 464 V440"/>
  </g>
  <g fill="#f0c4d4" opacity="0.4">
    <rect x="14" y="14" width="3" height="3"/>
    <rect x="1183" y="14" width="3" height="3"/>
    <rect x="14" y="463" width="3" height="3"/>
    <rect x="1183" y="463" width="3" height="3"/>
  </g>

  <text x="48" y="44" fill="#e07098" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="12" letter-spacing="3.2">/KERNEL</text>
  <text x="140" y="44" fill="#7a7280" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2.6">PRACTICE MAP  /  THREE SURFACES  /  ONE COMPILER</text>
  <text x="980" y="44" fill="#5a5460" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2.2">SCHEMATIC 03</text>

  <line x1="48" y1="58" x2="1152" y2="58" stroke="#f0c4d4" stroke-opacity="0.2"/>

  <g fill="none" stroke="#e07098" stroke-width="1.2" stroke-dasharray="5 8" opacity="0.7" marker-end="url(#tick)">
    <path d="M 368 168 H 456">
      <animate attributeName="stroke-dashoffset" values="0;-26" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M 744 168 H 832">
      <animate attributeName="stroke-dashoffset" values="0;-26" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M 600 252 V 300">
      <animate attributeName="stroke-dashoffset" values="0;-26" dur="1.1s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle r="2.4" fill="#f0c4d4">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M 368 168 H 456"/>
  </circle>
  <circle r="2.4" fill="#f0c4d4">
    <animateMotion dur="1.6s" begin="0.4s" repeatCount="indefinite" path="M 744 168 H 832"/>
  </circle>
  <circle r="2.4" fill="#e07098">
    <animateMotion dur="1.4s" begin="0.2s" repeatCount="indefinite" path="M 600 252 V 300"/>
  </circle>
  <g fill="#0c0a10" stroke="#e07098" stroke-width="1">
    <rect x="364" y="164" width="8" height="8"/>
    <rect x="448" y="164" width="8" height="8"/>
    <rect x="740" y="164" width="8" height="8"/>
    <rect x="824" y="164" width="8" height="8"/>
    <rect x="596" y="248" width="8" height="8"/>
    <rect x="596" y="296" width="8" height="8"/>
  </g>

  <rect x="48" y="84" width="320" height="168" fill="#120f18" stroke="#f0c4d4" stroke-opacity="0.28"/>
  <rect x="48" y="84" width="6" height="168" fill="#e07098"/>
  <g fill="none" stroke="#f0c4d4" stroke-opacity="0.28" stroke-width="1">
    <path d="M62 96 H78 M62 96 V112"/>
    <path d="M360 96 H344 M360 96 V112"/>
    <path d="M62 240 H78 M62 240 V224"/>
    <path d="M360 240 H344 M360 240 V224"/>
  </g>
  <text x="72" y="112" fill="#e07098" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2.8">L0  INTERACTION</text>
  <text x="72" y="142" fill="#eee8ee" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600">Primitives</text>
  <text x="72" y="172" fill="#9a90a0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="13">v-ellipsis-tooltip</text>
  <text x="72" y="194" fill="#9a90a0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="13">vCopy / on-demand tooltip</text>
  <text x="72" y="216" fill="#9a90a0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="13">UnoCSS SVG icon HMR</text>
  <text x="72" y="238" fill="#5a5460" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="11" letter-spacing="1.4">KILL IDLE INSTANCES  /  KEEP THE PAGE COLD</text>

  <rect x="456" y="84" width="288" height="168" fill="#120f18" stroke="#f0c4d4" stroke-opacity="0.28"/>
  <rect x="456" y="84" width="6" height="168" fill="#f0c4d4"/>
  <g fill="none" stroke="#f0c4d4" stroke-opacity="0.28" stroke-width="1">
    <path d="M470 96 H486 M470 96 V112"/>
    <path d="M736 96 H720 M736 96 V112"/>
    <path d="M470 240 H486 M470 240 V224"/>
    <path d="M736 240 H720 M736 240 V224"/>
  </g>
  <text x="480" y="112" fill="#f0c4d4" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2.8">L1  TYPE SURFACE</text>
  <text x="480" y="142" fill="#eee8ee" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600">Build-time .d.ts</text>
  <text x="480" y="172" fill="#9a90a0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="13">vite-plugin-fetch-dts</text>
  <text x="480" y="194" fill="#9a90a0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="13">remote Vue / WebC types</text>
  <text x="480" y="216" fill="#9a90a0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="13">OpenAPI request generator</text>
  <text x="480" y="238" fill="#5a5460" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="11" letter-spacing="1.4">TYPES ARRIVE BEFORE THE BUNDLE</text>

  <rect x="832" y="84" width="320" height="168" fill="#120f18" stroke="#f0c4d4" stroke-opacity="0.28"/>
  <rect x="832" y="84" width="6" height="168" fill="#c45a8a"/>
  <g fill="none" stroke="#f0c4d4" stroke-opacity="0.28" stroke-width="1">
    <path d="M846 96 H862 M846 96 V112"/>
    <path d="M1144 96 H1128 M1144 96 V112"/>
    <path d="M846 240 H862 M846 240 V224"/>
    <path d="M1144 240 H1128 M1144 240 V224"/>
  </g>
  <text x="856" y="112" fill="#e07098" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2.8">L2  AGENT RUNTIME</text>
  <text x="856" y="142" fill="#eee8ee" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600">Installable skills</text>
  <text x="856" y="172" fill="#9a90a0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="13">faker-mock-setup</text>
  <text x="856" y="194" fill="#9a90a0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="13">scrapling-config-crawl</text>
  <text x="856" y="216" fill="#9a90a0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="13">skills.sh/cerrda</text>
  <text x="856" y="238" fill="#5a5460" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="11" letter-spacing="1.4">WORKFLOWS WITH HARD RULES</text>

  <rect x="48" y="300" width="1104" height="132" fill="#120f18" stroke="#f0c4d4" stroke-opacity="0.28"/>
  <rect x="48" y="300" width="6" height="132" fill="#e07098"/>
  <g fill="none" stroke="#f0c4d4" stroke-opacity="0.28" stroke-width="1">
    <path d="M62 312 H78 M62 312 V328"/>
    <path d="M1144 312 H1128 M1144 312 V328"/>
    <path d="M62 420 H78 M62 420 V404"/>
    <path d="M1144 420 H1128 M1144 420 V404"/>
  </g>
  <text x="72" y="332" fill="#e07098" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="11" letter-spacing="3">COMPILER THESIS</text>
  <text x="72" y="368" fill="#eee8ee" font-family="Bahnschrift, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600">Humans read the tool. Agents execute the same context.</text>
  <text x="72" y="400" fill="#9a90a0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="14">Vue / Nuxt judgment -&gt; npm plugins / directives -&gt; skills.sh workflows.</text>
  <text x="72" y="422" fill="#5a5460" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="12" letter-spacing="1.8">dsh-cerrda-theme is the skin. the kernel is the type system and the skill graph.</text>

  <rect width="1200" height="480" fill="url(#scan3)" pointer-events="none"/>
  <rect width="1200" height="480" filter="url(#grain3)" opacity="0.45" pointer-events="none"/>
