<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="CERRDA boot sequence">
  <title>boot - cerrda@kernel</title>
  <defs>
    <pattern id="scan2" width="1200" height="3" patternUnits="userSpaceOnUse">
      <rect width="1200" height="1" fill="#000" opacity="0.35"/>
    </pattern>
    <filter id="grain2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.06"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="#0c0a10"/>

  <rect x="48" y="24" width="1104" height="372" fill="#100e16" stroke="#f0c4d4" stroke-opacity="0.28"/>
  <rect x="50" y="26" width="1100" height="368" fill="none" stroke="#f0c4d4" stroke-opacity="0.08"/>
  <rect x="48" y="24" width="1104" height="32" fill="#16121c" stroke="#f0c4d4" stroke-opacity="0.28"/>

  <g transform="translate(64, 36)">
    <rect width="8" height="8" fill="#e07098"/>
    <rect x="14" width="8" height="8" fill="#c4a070"/>
    <rect x="28" width="8" height="8" fill="#7dcea0"/>
  </g>
  <text x="120" y="46" fill="#9a90a0" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2.4">cerrda@kernel — zsh — 120x42</text>
  <text x="968" y="46" fill="#5a5460" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2.2">TTY.01</text>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="15" letter-spacing="0.4">
    <text x="72" y="96">
      <tspan fill="#e07098">$</tspan>
      <tspan fill="#5a5460"> uname -a</tspan>
    </text>
    <text x="72" y="124" fill="#d8d0d8">CERRDA/KERNEL 2026.9  vue/nuxt  vite  agent/dx  +type-surface</text>

    <text x="72" y="164">
      <tspan fill="#e07098">$</tspan>
      <tspan fill="#5a5460"> whoami</tspan>
    </text>
    <text x="72" y="192" fill="#f0c4d4">cerrda   frontend engineer / agent infrastructure</text>

    <text x="72" y="232">
      <tspan fill="#e07098">$</tspan>
      <tspan fill="#5a5460"> cat ~/THESIS.md</tspan>
    </text>
    <text x="72" y="260" fill="#c8c0c8">Compile one-off judgment into installable, versioned tools.</text>
    <text x="72" y="284" fill="#c8c0c8">Types land at build time. Agents execute the workflow.</text>

    <text x="72" y="324">
      <tspan fill="#e07098">$</tspan>
      <tspan fill="#5a5460"> ls ~/signals --oneline</tspan>
    </text>
    <text x="72" y="352" fill="#d8d0d8">fetch-dts   faker-mock   scrapling   dsh-theme   v-ellipsis   vCopy</text>
  </g>

  <rect x="64" y="368" width="1072" height="22" fill="#e07098" opacity="0.06"/>
  <text x="72" y="384" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="15" letter-spacing="0.4">
    <tspan fill="#7dcea0">$</tspan>
    <tspan fill="#7dcea0"> status</tspan>
    <tspan fill="#9a90a0">   runtime online / ready for handshake</tspan>
  </text>
  <rect x="468" y="372" width="8" height="15" fill="#f0c4d4">
    <animate attributeName="opacity" values="1;0;1" dur="1.05s" repeatCount="indefinite"/>
  </rect>

  <rect x="48" y="24" width="1104" height="372" fill="url(#scan2)" pointer-events="none"/>
  <rect x="48" y="24" width="1104" height="372" filter="url(#grain2)" opacity="0.45" pointer-events="none"/>
</svg>
