  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f0c4d4" stroke-width="0.4" opacity="0.09"/>
    </pattern>
    <pattern id="scan" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect width="1200" height="1.2" fill="#000" opacity="0.28"/>
    </pattern>
    <radialGradient id="orbL" cx="18%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#c45a8a" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#0c0a10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbR" cx="82%" cy="58%" r="42%">
      <stop offset="0%" stop-color="#6a2a48" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#0c0a10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phosphor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c894a8"/>
      <stop offset="45%" stop-color="#f6dce6"/>
      <stop offset="100%" stop-color="#e07098"/>
      <animate attributeName="x1" values="-0.35;0.55;-0.35" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.25;1.15;0.25" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.07"/>
      </feComponentTransfer>
    </filter>
  </defs>

